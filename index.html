<!DOCTYPE html>
<html class="h-full" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CRM Suite - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
</head>
<body class="h-full bg-slate-50 flex items-center justify-center font-sans relative overflow-hidden">
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-blue-100 blur-3xl opacity-50"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-indigo-100 blur-3xl opacity-30"></div>
    </div>

    <div class="w-full max-w-md p-6 z-10 relative">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">CRM Suite</h1>
            <p class="text-slate-600">Inicia sesión con Firebase Auth</p>
        </div>

        <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-6">
            <!-- Mensaje de error para credenciales incorrectas -->
            <div id="auth-error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg font-medium"></div>

            <form id="form-login" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1" for="login-email">Correo Electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <span class="material-symbols-outlined text-base">mail</span>
                        </div>
                        <input class="block w-full pl-10 pr-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-sm" id="login-email" name="email" placeholder="usuario@empresa.com" required type="email"/>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1" for="login-password">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <span class="material-symbols-outlined text-base">lock</span>
                        </div>
                        <input class="block w-full pl-10 pr-3 py-2 rounded-lg border border-slate-300 bg-white text-slate-900 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-sm" id="login-password" name="password" placeholder="••••••••" required type="password"/>
                    </div>
                </div>

                <button id="btn-submit-login" class="w-full py-2.5 px-4 rounded-lg bg-blue-600 text-white font-semibold shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" type="submit">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts JS -->
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
